[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "deribit-price-api"
version = "1.0.0"
description = "Deribit index-price collector and HTTP API"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiohttp==3.13.3",
    "alembic==1.17.2",
    "asyncpg==0.31.0",
    "celery[redis]==5.6.3",
    "fastapi==0.143.1",
    "flower==2.2.0",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "celery-types==0.26.0",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/deribit_price_api"]
